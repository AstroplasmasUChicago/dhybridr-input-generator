name: Test generator
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Capacity, conversion, schema, and preset checks
        run: |
          node tests/import.test.cjs
          node tests/presets.test.cjs
